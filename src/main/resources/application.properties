spring.application.name=flashcard-api
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.mvc.apiversion.required=true
spring.mvc.apiversion.use.path-segment=1
spring.mvc.apiversion.supported=1
spring.data.redis.host=${SPRING_DATA_REDIS_HOST}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT}

server.port=8080
jwt.secret=${JWT_SECRET}
app.cookie.secure=${APP_COOKIE_SECURE:false}

logging.level.com.example.flashcard_api=DEBUG
